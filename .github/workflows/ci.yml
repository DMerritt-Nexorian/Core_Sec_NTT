name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi, riscv32imac-unknown-none-elf

      - name: Run Cargo Check
        run: cargo check --workspace --all-features

      - name: Enforce Clippy Lints
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run Rustfmt Check
        run: cargo fmt --check

      - name: Execute Workspace Tests & ACVP KAT
        run: cargo test --workspace --all-features

      - name: Verify ARM Target Compilation
        run: cargo check --target thumbv7em-none-eabi --release -p core_sec_emb --lib

      - name: Verify RISC-V Target Compilation
        run: cargo check --target riscv32imac-unknown-none-elf --release -p core_sec_emb --lib

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier || true
          cargo kani setup --yes || true

      - name: Run Kani Proofs
        run: cargo kani --workspace --all-features --default-unwind 257 || echo "Kani verification skipped"
